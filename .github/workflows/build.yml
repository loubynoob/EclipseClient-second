{"name": "build", "on": ["push", "workflow_dispatch"], "jobs": {"build": {"runs-on": "ubuntu-24.04", "steps": [{"uses": "actions/checkout@v4"}, {"run": "mkdir work && unzip -q ./*.zip -d work"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": 25}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "9.4.0"}}, {"run": "gradle build --stacktrace", "working-directory": "work"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "eclipse-client-jar", "path": "work/build/libs/*.jar"}}]}}}
